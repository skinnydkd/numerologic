<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Simbològic — àlgebra amb símbols</title>
  <meta name="description" content="Cada dia tres graelles de símbols amb els totals de files i columnes. Troba quant val cada símbol." />
  <link rel="canonical" href="https://numerologic.cat/simbologic/" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#58b4c4" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Simbològic" />
  <meta property="og:title" content="Simbològic — àlgebra amb símbols" />
  <meta property="og:description" content="Tres graelles al dia: troba quant val cada símbol a partir dels totals." />
  <meta property="og:url" content="https://numerologic.cat/simbologic/" />
  <meta property="og:image" content="https://numerologic.cat/simbologic/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ca_ES" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://numerologic.cat/simbologic/og-image.png" />
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="pl">
    <header class="topbar">
      <h1 class="logo" aria-label="Simbològic">SIMBO<span class="t">L</span><span class="r">Ò</span><span class="t">GIC</span></h1>
    </header>

    <div class="goal">Troba quant val cada símbol</div>
    <div class="tabs" id="tabs"></div>

    <div class="grid" id="grid"></div>
    <div class="symbols" id="symbols"></div>
    <div class="flash" id="flash"></div>

    <div class="keys" id="keys"></div>
    <div class="actions">
      <button class="pill" id="del">Esborra</button>
      <button class="pill send" id="check">Comprova</button>
    </div>

    <div class="foot">
      <button class="found" id="count">—</button>
      <div class="status">
        <button class="rankbtn" id="rankBtn">—</button>
        · <span class="goalst" id="goalSt">✦</span>
        · <span class="star" id="star">★</span><span class="streak" id="streak"></span>
      </div>
      <div class="links">
        <span class="num" id="num">Núm. —</span>
        · <button class="rankbtn" id="yesterday">Solució d'ahir</button>
        · <button class="rankbtn" id="pistes">Pistes</button>
        · <button class="rankbtn" id="help">Com jugar</button>
        · <button class="rankbtn" id="share">Comparteix</button>
      </div>
    </div>

    <nav class="games" aria-label="Jocs de la família Lògic">
      <a class="game" href="../"><img src="../favicon.svg" alt="" width="28" height="28" /><span>Numerològic</span></a>
      <a class="game" href="../igualogic/"><img src="../igualogic/favicon.svg" alt="" width="28" height="28" /><span>Igualògic</span></a>
      <a class="game here" href="../simbologic/" aria-current="page"><img src="../simbologic/favicon.svg" alt="" width="28" height="28" /><span>Simbològic</span></a>
      <a class="game" href="../quadrologic/"><img src="../quadrologic/favicon.svg" alt="" width="28" height="28" /><span>Quadrològic</span></a>
      <a class="game" href="../rutalogic/"><img src="../rutalogic/favicon.svg" alt="" width="28" height="28" /><span>Rutalògic</span></a>
      <a class="game" href="https://musicologic.cat/"><img src="../musicologic.svg" alt="" width="28" height="28" /><span>Musicològic</span></a>
    </nav>
  </main>

  <div class="panel hidden" id="panel" onclick="if(event.target===this)this.classList.add('hidden')"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
