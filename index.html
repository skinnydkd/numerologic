<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="google-site-verification" content="3ErHthar34vW-m-O74NP7dqSt7M6xUjpH5Cq6Dx_OKU" />
  <title>Numerològic — el Paraulògic matemàtic</title>
  <meta name="description" content="El Paraulògic matemàtic: cada dia un objectiu i un rusc de 7 dígits. Troba expressions que hi arribin." />
  <link rel="canonical" href="https://numerologic.cat/" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#58b4c4" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Previsualització en compartir (WhatsApp, X, Facebook, Telegram…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Numerològic" />
  <meta property="og:title" content="Numerològic — el Paraulògic matemàtic" />
  <meta property="og:description" content="Cada dia un objectiu i un rusc de 7 dígits. Troba expressions que hi arribin i suma punts." />
  <meta property="og:url" content="https://numerologic.cat/" />
  <meta property="og:image" content="https://numerologic.cat/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ca_ES" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Numerològic — el Paraulògic matemàtic" />
  <meta name="twitter:description" content="Cada dia un objectiu i un rusc de 7 dígits. Troba expressions que hi arribin i suma punts." />
  <meta name="twitter:image" content="https://numerologic.cat/og-image.png" />
</head>
<body>
  <main class="pl">
    <header class="topbar">
      <div class="logo">NUMEROL<span class="o">Ò</span><span class="gic">GIC</span></div>
      <div class="modes">
        <button class="mode active" data-mode="daily">Diari</button>
        <button class="mode" data-mode="practice">Pràctica</button>
      </div>
    </header>

    <div class="goal">Arriba a <b id="target">—</b></div>
    <div class="difficulty" id="difficulty"></div>
    <div class="disp" id="display"><span class="cursor">|</span></div>
    <div class="result" id="result"></div>
    <div class="flash" id="flash"></div>

    <div class="hive" id="hive"></div>
    <div class="ops" id="ops"></div>

    <div class="actions">
      <button class="pill" id="del">Esborra</button>
      <button class="round" id="shuffle" title="Remena">⟳</button>
      <button class="pill send" id="send">Envia</button>
    </div>

    <div class="foot">
      <button class="found" id="count">—</button>
      <div class="meta">
        <button class="rankbtn" id="rankBtn">—</button>
        · <span class="star" id="tutti">★ Tutti pendent</span>
        · <button class="rankbtn" id="share">Comparteix</button>
        · <button class="rankbtn" id="help">Com jugar</button>
        · <button class="rankbtn" id="pistes">Pistes</button>
        <span id="practiceNew" class="hidden"> · <button class="rankbtn" id="newPractice">Nova pràctica</button></span>
      </div>
      <div class="brevi" id="brevi"></div>
    </div>
  </main>

  <div class="panel hidden" id="panel" onclick="if(event.target===this)this.classList.add('hidden')"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
