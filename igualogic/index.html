<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Igualògic — endevina la igualtat amagada</title>
  <meta name="description" content="Cada dia una igualtat amagada de 8 caselles. Tens 6 intents: els colors et diuen què hi és i on va." />
  <link rel="canonical" href="https://numerologic.cat/igualogic/" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#58b4c4" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Igualògic" />
  <meta property="og:title" content="Igualògic — endevina la igualtat amagada" />
  <meta property="og:description" content="Cada dia una igualtat amagada. 6 intents i els colors com a pista." />
  <meta property="og:url" content="https://numerologic.cat/igualogic/" />
  <meta property="og:image" content="https://numerologic.cat/igualogic/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ca_ES" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://numerologic.cat/igualogic/og-image.png" />
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="pl">
    <header class="topbar">
      <h1 class="logo" aria-label="Igualògic">IGUA<span class="t">L</span><span class="r">Ò</span><span class="t">GIC</span></h1>
    </header>

    <div class="goal">Endevina la igualtat amagada</div>
    <div class="difficulty" id="difficulty"></div>
    <div class="hardrow"><button class="pill hardbtn" id="hard" aria-pressed="false">★ Mode difícil</button></div>

    <div class="board" id="board"></div>
    <div class="flash" id="flash"></div>

    <div class="keys" id="keys"></div>
    <div class="actions">
      <button class="pill" id="del">Esborra</button>
      <button class="pill send" id="send">Envia</button>
    </div>

    <div class="foot">
      <button class="found" id="count">—</button>
      <div class="status">
        <button class="rankbtn" id="rankBtn">—</button>
        · <span class="goalst" id="goalSt">✦ Pendent</span>
        · <span class="star" id="star">★ —</span><span class="streak" id="streak"></span>
      </div>
      <div class="links">
        <span class="num" id="num">Núm. —</span>
        · <button class="rankbtn" id="yesterday">Solució d'ahir</button>
        · <button class="rankbtn" id="pistes">Pistes</button>
        · <button class="rankbtn" id="help">Com jugar</button>
        · <button class="rankbtn" id="share">Comparteix</button>
      </div>
    </div>
  </main>

  <div class="panel hidden" id="panel" onclick="if(event.target===this)this.classList.add('hidden')"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
